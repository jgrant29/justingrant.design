:root {

  color-scheme:light;
}

.wash { mix-blend-mode:var(--wash-blend); opacity:var(--wash-opacity); }
.riso { opacity:var(--riso); }
.tape { fill:var(--tape); stroke:var(--tape-edge); stroke-width:.5; }

:root {
  --font-display:"Libre Caslon Text", "Iowan Old Style", Georgia, serif;
  --font-sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-type:"Courier Prime", "Courier New", ui-monospace, monospace;
  --font-hand:"Reenie Beanie", "Bradley Hand", "Segoe Print", cursive;
  --max:1140px; --read:66ch;
}
*, *::before, *::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--paper); color:var(--ink); font:400 17px/1.6 var(--font-sans); -webkit-font-smoothing:antialiased; }
img { max-width:100%; height:auto; display:block; }
a { color:var(--link); text-underline-offset:3px; text-decoration-thickness:1px; }
a:hover { text-decoration-thickness:2px; }
:focus-visible { outline:2px solid var(--focus); outline-offset:3px; border-radius:2px; }
h1, h2, h3 { font-family:var(--font-display); font-weight:400; margin:0; text-wrap:balance; letter-spacing:-.005em; }
p { margin:0; }
.skip { position:absolute; left:-9999px; top:8px; z-index:50; background:var(--paper); color:var(--ink); padding:8px 12px; box-shadow:inset 0 0 0 1px var(--rule-strong); }
.skip:focus { left:16px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.wrap { max-width:var(--max); margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); position:relative; z-index:1; }
.label, .step, .meta { font:400 13px/1.45 var(--font-type); color:var(--ink-2); letter-spacing:.01em; }
.hand { font:400 27px/1.02 var(--font-hand); color:var(--pen); display:block; }

/* one large watercolor bloom, fixed in a corner of the table */
.bloom { contain:strict; will-change:transform; position:fixed; top:-90px; right:-140px; width:640px; height:540px; pointer-events:none; z-index:0; opacity:.6; }
.bloom svg { width:100%; height:100%; display:block; }

/* header */
.site-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px 28px; padding:22px 0 14px; border-bottom:1px solid var(--rule); }
.brand { display:flex; align-items:flex-end; gap:10px; text-decoration:none; color:var(--ink); }
.brand svg { width:26px; height:34px; flex:none; }
.brand strong { display:block; font:italic 400 27px/1 var(--font-display); }
.brand span { display:block; font:400 12px/1.3 var(--font-type); color:var(--ink-2); margin-top:4px; }
.nav { display:flex; gap:22px; }
.nav a { font:400 15px/1.3 var(--font-sans); color:var(--ink-2); text-decoration:none; padding:6px 0; border-bottom:2px solid transparent; }
.nav a:hover { color:var(--ink); }
.nav a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--i-kale); }

main { padding:44px 0 72px; }

/* buttons: one solid primary per view, underlined text for the rest */
.write, .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font:600 15px/20px var(--font-sans); padding:11px 18px; border-radius:4px; background:var(--primary); color:var(--on-primary); text-decoration:none; border:0; cursor:pointer; }
.write:hover { text-decoration:none; filter:brightness(1.08); }
.copy, .link-btn { font:400 14px/20px var(--font-type); background:none; border:0; padding:4px 0; color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule-strong); text-underline-offset:4px; cursor:pointer; }
.copy:hover { text-decoration-color:var(--ink); }

/* tags: typed text with a small colored dot */
.tag { font:400 13px/1.4 var(--font-type); display:inline-flex; align-items:center; gap:7px; color:var(--ink); white-space:nowrap; }
.tag::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--dot, var(--ink-2)); flex:none; }
.v-tomato { --dot:var(--i-radish); --veg:var(--i-radish); }
.v-pea { --dot:var(--i-pea); --veg:var(--i-pea); }
.v-carrot { --dot:var(--i-carrot); --veg:var(--i-carrot); }

/* ---------- home ---------- */
.hero { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:16px 40px; align-items:end; margin-bottom:40px; }
.hero h1 { font-size:clamp(34px, 5vw, 52px); line-height:1.06; letter-spacing:-.015em; max-width:21ch; }
.hero p { margin-top:16px; max-width:60ch; color:var(--ink-2); }
.hero .hand { transform:rotate(-3deg); max-width:230px; text-align:right; margin-bottom:6px; }
.hand-cta { text-decoration:none; text-underline-offset:5px; }
.hand-cta:hover { text-decoration:underline; text-decoration-thickness:1.5px; }
.hand-cta:focus-visible { outline-offset:6px; }

.filters { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 20px; padding-bottom:14px; margin-bottom:32px; border-bottom:1px solid var(--rule); }
.filters button { font:400 16px/24px var(--font-display); background:none; border:0; padding:0; color:var(--ink-2); cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.filters button i { width:9px; height:9px; border-radius:50%; background:var(--dot); }
.filters button:hover { color:var(--ink); }
.filters button[aria-pressed="true"] { color:var(--ink); text-decoration:underline; text-decoration-color:var(--veg, var(--ink)); text-decoration-thickness:2px; text-underline-offset:6px; }

.garden { display:grid; grid-template-columns:minmax(0, 1fr); gap:32px; }
.garden .sheet { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 400px); align-items:stretch; }
.garden .sheet .body { grid-column:1; grid-row:1; padding:26px 8px 26px 28px; gap:16px; }
.garden .sheet .press { grid-column:2; grid-row:1; align-self:center; }
.garden .sheet .museum h2 { font-size:clamp(22px, 2.4vw, 27px); line-height:1.2; }
.garden .sheet .pair { grid-template-columns:1fr 1fr; gap:28px; font-size:16px; }
.sheet { display:flex; flex-direction:column; background:var(--paper); border-radius:2px; box-shadow:inset 0 0 0 1px var(--rule), var(--sheet-shadow); color:inherit; text-decoration:none; transition:transform .25s ease, box-shadow .25s ease; min-width:0; }
.sheet:hover { transform:translateY(-3px) rotate(-.15deg); text-decoration:none; }
.sheet .press { display:block; aspect-ratio:300 / 230; }
.sheet .press svg { width:100%; height:100%; display:block; }
.sheet .body { padding:4px 22px 22px; display:flex; flex-direction:column; gap:14px; flex:1; }
.museum { border:1px solid var(--rule-strong); padding:10px 12px; display:grid; gap:7px; background:var(--paper); }
.museum .row { display:flex; justify-content:space-between; gap:12px; font:400 12px/1.4 var(--font-type); color:var(--ink-2); }
.museum .row span:last-child { text-align:right; white-space:nowrap; }
.museum h2, .museum h1 { font-size:19px; line-height:1.28; color:var(--ink); }
.pair { display:grid; gap:12px; font-size:15px; line-height:1.55; }
.pair b { display:block; font:italic 400 15px/1.3 var(--font-display); color:var(--ink-2); margin-bottom:2px; }
.sheet .foot { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:auto; padding-top:2px; }
.sheet .foot .more { font:400 13px/1.4 var(--font-type); color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule-strong); text-underline-offset:4px; }
.sheet.feature { grid-column:span 2; grid-row:span 2; }
.sheet.feature .press { aspect-ratio:auto; flex:1; min-height:420px; }
.sheet.feature .body { flex:none; }
.sheet.feature .museum h2 { font-size:27px; line-height:1.18; }
.sheet.feature .pair { grid-template-columns:1fr 1fr; gap:28px; font-size:16px; }
.garden.filtered .sheet.feature { grid-column:span 2; grid-row:auto; }
.garden .sheet[hidden] { display:none; }

/* results: the harvest */
.harvest { margin-top:56px; display:grid; gap:20px; }
.harvest-h { display:grid; gap:4px; }
.harvest-h h2 { font:italic 400 clamp(26px, 3vw, 32px)/1.15 var(--font-display); }
.yields { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:0 36px; border-top:1px solid var(--rule-strong); }
.yield { margin:0; padding:20px 0 24px; border-bottom:1px solid var(--rule); display:grid; gap:6px; align-content:start; min-width:0; }
.yield .num { font:400 clamp(36px, 4vw, 48px)/1 var(--font-display); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.yield .what { font-size:15px; line-height:1.5; color:var(--ink); max-width:32ch; }
.yield .plot { margin-top:8px; }
.chart { display:block; max-width:100%; height:auto; overflow:visible; }
.chart .ct { font:400 13px var(--font-type); fill:var(--ink); }
.chart .ctl { fill:var(--ink-2); }
.yield figcaption { display:grid; gap:2px; font:400 12px/1.45 var(--font-type); color:var(--ink-2); }
.yield figcaption a { color:var(--ink-2); }
.yield-row { display:flex; flex-wrap:wrap; gap:4px 26px; padding:2px 0 2px; }
.yield-row span { font:400 13px/1.3 var(--font-type); color:var(--ink-2); }
.yield-row b { display:block; font:400 30px/1.05 var(--font-display); color:var(--ink); font-variant-numeric:tabular-nums; }

/* collector's note: a typed museum label pinned under the specimens */
.collector { position:relative; max-width:560px; margin:40px 0 0 auto; padding:16px 20px 18px; border:1px solid var(--rule-strong); background:var(--paper); transform:rotate(-.4deg); display:grid; gap:8px; }
.collector::before { content:""; position:absolute; top:-8px; left:50%; width:64px; height:16px; margin-left:-32px; background:var(--tape); box-shadow:inset 0 0 0 .5px var(--tape-edge); transform:rotate(-3deg); }
.collector .row { display:flex; justify-content:space-between; gap:12px; font:400 12px/1.4 var(--font-type); color:var(--ink-2); }
.collector h2 { font:italic 400 22px/1.2 var(--font-display); }
.collector p { font-size:16px; line-height:1.6; }

/* research, contact, build notes: ruled lines, not boxes */
.section { margin-top:88px; display:grid; gap:18px; }
.section > h2, .contact h2, .built > h2 { font-size:clamp(28px, 3.4vw, 38px); line-height:1.15; max-width:24ch; }
.intro { color:var(--ink-2); max-width:var(--read); }
.duo { display:grid; grid-template-columns:1fr 1fr; gap:24px 56px; margin-top:12px; }
.duo .label { display:block; font:italic 400 19px/1.3 var(--font-display); color:var(--ink); margin-bottom:8px; }
.plain, .checks { list-style:none; margin:0; padding:0; border-top:1px solid var(--rule-strong); }
.plain li { padding:13px 0; border-bottom:1px solid var(--rule); font-size:16px; line-height:1.55; }
.plain b, .checks b { font-weight:600; }
.contact { margin-top:88px; padding-top:28px; border-top:1px solid var(--ink); display:grid; gap:20px; }
.email-row { display:flex; flex-wrap:wrap; align-items:center; gap:12px 24px; }
.email-text { font:400 17px/1.4 var(--font-type); color:var(--ink); }
.built { margin-top:88px; display:grid; gap:18px; }
.specs { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); margin:8px 0 0; border-top:1px solid var(--rule-strong); }
.specs div { padding:16px 20px 16px 0; border-bottom:1px solid var(--rule); display:grid; gap:2px; align-content:start; }
.specs dt { font:400 38px/1.1 var(--font-display); font-variant-numeric:tabular-nums; }
.specs dd { margin:0; font:400 13px/1.45 var(--font-type); color:var(--ink-2); }
.checks-h { font:italic 400 24px/1.2 var(--font-display); margin-top:28px; }
.checks-intro { color:var(--ink-2); max-width:var(--read); }
.checks { display:grid; grid-template-columns:1fr 1fr; column-gap:48px; border-top:0; }
.checks li { padding:12px 0; border-top:1px solid var(--rule); display:grid; gap:2px; font-size:15px; line-height:1.5; }
.checks li span { color:var(--ink-2); }

/* footer */
.site-foot { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 24px; padding:20px 0 36px; border-top:1px solid var(--rule); font:400 13px/1.4 var(--font-type); color:var(--ink-2); }
.site-foot nav { display:flex; gap:20px; }
.site-foot a { color:var(--ink-2); }

/* ---------- case studies ---------- */
.back { display:inline-block; font:400 14px/1.4 var(--font-type); color:var(--ink); margin-bottom:22px; }
.detail { display:grid; grid-template-columns:minmax(0, 1fr) 290px; gap:40px; align-items:start; }
.detail-sheet { background:var(--paper); border-radius:2px; box-shadow:inset 0 0 0 1px var(--rule), var(--sheet-shadow); min-width:0; }
.detail-sheet .press { display:block; aspect-ratio:600 / 300; }
.detail-sheet .press svg { width:100%; height:100%; display:block; }
.detail-sheet .inner { padding:4px 40px 36px; display:grid; gap:22px; }
.detail-sheet .museum h1 { font-size:clamp(28px, 3.6vw, 40px); line-height:1.12; letter-spacing:-.01em; }
.lede { font-size:19px; line-height:1.6; max-width:62ch; }
.side { display:grid; gap:26px; position:sticky; top:24px; }
.side .hand { transform:rotate(-4deg); justify-self:start; margin-left:6px; }
.facts { margin:0; display:grid; border-top:1px solid var(--rule-strong); }
.facts div { padding:11px 0; border-bottom:1px solid var(--rule); display:grid; gap:2px; }
.facts dt { font:400 12px/1.4 var(--font-type); color:var(--ink-2); }
.facts dd { margin:0; font-size:15px; line-height:1.5; }
.read { max-width:var(--read); margin:64px auto 0; display:grid; gap:48px; }
.block { display:grid; gap:14px; }
.block h2 { font:italic 400 clamp(24px, 2.8vw, 30px)/1.2 var(--font-display); }
.block p { font-size:17px; line-height:1.68; }
.block ul { list-style:none; margin:0; padding:0; border-top:1px solid var(--rule-strong); }
.block li { padding:12px 0; border-bottom:1px solid var(--rule); font-size:16px; line-height:1.6; }
.block li b { font-weight:600; }
.step { display:block; }
.note-line, .sources { font:400 13px/1.5 var(--font-type); color:var(--ink-2); }
.sources a { color:var(--ink-2); }

/* figures are mounted on the sheet with two strips of tape */
.figure { margin:56px 0 0; }
.frame { display:block; position:relative; background:var(--paper); padding:10px; border-radius:2px; box-shadow:inset 0 0 0 1px var(--rule), var(--sheet-shadow); }
.frame::before, .frame::after { content:""; position:absolute; width:70px; height:18px; background:var(--tape); box-shadow:inset 0 0 0 .5px var(--tape-edge); z-index:2; pointer-events:none; }
.frame::before { top:-7px; left:22px; transform:rotate(-5deg); }
.frame::after { top:-6px; right:24px; transform:rotate(4deg); }
.frame img { width:100%; height:auto; }
a.frame { cursor:zoom-in; }
.zoom-hint { display:none; }
@media (max-width: 640px) { .zoom-hint { display:inline; } }
.figure figcaption, .figcap { margin-top:12px; font:400 13px/1.5 var(--font-type); color:var(--ink-2); max-width:var(--read); }

.next { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:80px; border-top:1px solid var(--rule-strong); }
.next a { display:grid; gap:4px; padding:16px 0; text-decoration:none; color:var(--ink); }
.next a:last-child { text-align:right; }
.next small { font:400 12px/1.4 var(--font-type); color:var(--ink-2); }
.next strong { font:400 19px/1.3 var(--font-display); }
.next a:hover strong { text-decoration:underline; text-underline-offset:4px; }

/* MDC final designs slider */
.slider { margin-top:48px; }
.slides { display:flex; gap:24px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; padding:10px 2px 4px; }
.slides::-webkit-scrollbar { display:none; }
.slide { flex:0 0 100%; margin:0; scroll-snap-align:start; min-width:0; }
.slide .frame { display:block; }
.slide figcaption { margin-top:16px; display:grid; gap:10px; }
.slide figcaption strong { font:400 20px/1.3 var(--font-display); }
.slide figcaption strong span { font:400 13px/1 var(--font-type); color:var(--ink-2); margin-right:10px; }
.pi { display:grid; grid-template-columns:1fr 1fr; gap:8px 32px; margin:0; border-top:1px solid var(--rule); padding-top:10px; }
.pi dt { font:italic 400 16px/1.3 var(--font-display); color:var(--ink-2); }
.pi dd { margin:4px 0 0; font-size:15px; line-height:1.55; }
.slider-nav { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:16px; }
.slider-nav button { font:inherit; cursor:pointer; }
.sbtn { min-width:44px; height:44px; border-radius:4px; border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink); font:400 18px/1 var(--font-type); }
.sbtn:hover { border-color:var(--ink); }
.dots { display:flex; gap:4px; }
.dots button { width:44px; height:44px; border:0; background:none; padding:0; display:grid; place-items:center; }
.dots button::before { content:""; width:28px; height:2px; background:var(--rule-strong); }
.dots button[aria-current="true"]::before { height:3px; background:var(--i-radish); }
.brand-pages { margin-top:56px; }
.brand-pages ul { list-style:none; margin:16px 0 0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:22px; }
@media (min-width:860px) { .brand-pages ul { grid-template-columns:repeat(5, minmax(0, 1fr)); } }
.brand-pages li { min-width:0; }
.brand-pages a { display:block; padding:6px; background:var(--paper); border-radius:2px; box-shadow:inset 0 0 0 1px var(--rule), var(--sheet-shadow); transition:transform .2s; }
.brand-pages a:hover { transform:translateY(-2px) rotate(-.4deg); }
.brand-pages span { display:block; margin-top:8px; font:400 12px/1.4 var(--font-type); color:var(--ink-2); }

/* ---------- about, résumé, 404 ---------- */
.about { display:grid; grid-template-columns:minmax(0, 340px) minmax(0, 1fr); gap:56px; align-items:start; }
.about .portrait { position:sticky; top:24px; display:grid; gap:14px; }
.about .portrait .frame { transform:rotate(-1.2deg); }
.about .read { margin:0; max-width:var(--read); gap:20px; }
.about h1, .cv h1 { font-size:clamp(34px, 4.6vw, 50px); line-height:1.08; letter-spacing:-.015em; }
.about .read p { font-size:18px; line-height:1.68; }
.about .write { justify-self:start; margin-top:8px; }
.press-sm { display:block; width:100%; aspect-ratio:300 / 230; }
.press-sm svg { width:100%; height:100%; display:block; }
.cv { max-width:820px; display:grid; gap:18px; }
.cv-top { display:grid; grid-template-columns:minmax(0, 1fr) 220px; gap:24px; align-items:end; }
.cv .lede { color:var(--ink-2); font-size:18px; }
.cv-sec { margin-top:28px; display:grid; gap:0; }
.cv-sec > h2 { font:italic 400 26px/1.2 var(--font-display); padding-bottom:10px; border-bottom:1px solid var(--rule-strong); }
.job { padding:20px 0; border-bottom:1px solid var(--rule); display:grid; gap:6px; }
.job-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 16px; }
.job-head h3 { font-size:21px; line-height:1.3; }
.when, .org { font:400 13px/1.45 var(--font-type); color:var(--ink-2); }
.job-sum { color:var(--ink-2); font-size:16px; line-height:1.6; }
.job-sum a { color:inherit; }
.job ul { margin:6px 0 0; padding-left:18px; display:grid; gap:6px; font-size:16px; line-height:1.6; }
.job li::marker { color:var(--rule-strong); }
.cv-skills { margin-top:16px; font-size:16px; line-height:1.7; }
.cv p:not([class]) { font-size:16px; line-height:1.6; }
.cv .write { justify-self:start; margin-top:32px; }
.cv .sprout-press { width:min(100%, 340px); }

  .garden .sheet { grid-template-columns:minmax(0, 1fr) minmax(0, 300px); }

}
@media (max-width: 860px) {
  .garden .sheet { grid-template-columns:1fr; }

  .garden .sheet .pair { grid-template-columns:1fr 1fr; gap:24px; }

  .read { margin-top:48px; gap:40px; }
  .block h2 { font-size:25px; }
  .figure { margin-top:40px; }
  .frame { padding:6px; }
  .frame::before, .frame::after { width:48px; height:14px; }
  .figure figcaption { font-size:12.5px; }
  a.frame::after { }
  .next { margin-top:56px; gap:0; }
  .next a { padding:14px 0; border-bottom:1px solid var(--rule); }
  .slide figcaption strong { font-size:18px; }
  .brand-pages ul { gap:16px; }
  .site-foot { flex-direction:column; gap:4px; }
  .site-foot nav { gap:24px; }
  .site-foot a { display:inline-block; padding:10px 0; }
  .about h1, .cv h1 { font-size:34px; }

  .garden .sheet { grid-template-columns:1fr; }

  .bloom { width:380px; height:320px; top:-60px; right:-120px; }

}
